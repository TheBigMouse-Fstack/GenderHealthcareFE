<!-- support-chat.component.html -->
<div class="ai-bot-container">
  <!-- Chat Panel -->
  <div class="ai-chat-panel" [class.active]="showChatPanel">
    <div class="ai-chat-header">
      <div class="header-content">
        <div class="ai-avatar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path
              d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2ZM21 9V7L15 1H5C3.89 1 3 1.89 3 3V19C3 20.11 3.89 21 5 21H11V19H5V3H13V9H21ZM18 11C16.34 11 15 12.34 15 14C15 15.66 16.34 17 18 17C19.66 17 21 15.66 21 14C21 12.34 19.66 11 18 11ZM18 23L15 20V22H13V24H15V23H18Z"
            />
          </svg>
        </div>
        <div class="header-text">
          <div class="title">AI Assistant</div>
          <div class="status">Online</div>
        </div>
      </div>
      <button class="close-btn" (click)="toggleChat()" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path
            d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41Z"
          />
        </svg>
      </button>
    </div>

    <div class="ai-chat-body">
      <div class="welcome-message">
        <div class="ai-message bot">
          <div class="message-avatar">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <circle cx="12" cy="12" r="3" />
              <path d="M12 1v6m0 6v6m11-7h-6m-6 0H1" />
            </svg>
          </div>
          <div class="message-content">
            <p>Hello! I'm your AI Assistant. How can I help you today?</p>
          </div>
        </div>
      </div>

      <!-- Typing indicator -->
      <div class="typing-indicator" [class.visible]="isTyping">
        <div class="ai-message bot">
          <div class="message-avatar">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <circle cx="12" cy="12" r="3" />
              <path d="M12 1v6m0 6v6m11-7h-6m-6 0H1" />
            </svg>
          </div>
          <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>

    <div class="ai-chat-input">
      <div class="input-container">
        <input
          type="text"
          placeholder="Type your message..."
          [(ngModel)]="message"
          (keydown.enter)="sendMessage()"
          #messageInput
        />
        <button
          class="send-btn"
          (click)="sendMessage()"
          [disabled]="!message.trim()"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M2,21L23,12L2,3V10L17,12L2,14V21Z" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Chat Bot Icon -->
  <div
    class="ai-bot-icon"
    (click)="toggleChat()"
    [class.active]="showChatPanel"
  >
    <div class="icon-inner">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
        <path
          d="M17.5 12C19.43 12 21 10.43 21 8.5C21 6.57 19.43 5 17.5 5C15.57 5 14 6.57 14 8.5C14 10.43 15.57 12 17.5 12ZM6.5 12C8.43 12 10 10.43 10 8.5C10 6.57 8.43 5 6.5 5C4.57 5 3 6.57 3 8.5C3 10.43 4.57 12 6.5 12ZM6.5 14C3.67 14 1 16.67 1 19.5V21H12V19.5C12 16.67 9.33 14 6.5 14ZM17.5 14C14.67 14 12 16.67 12 19.5V21H23V19.5C23 16.67 20.33 14 17.5 14Z"
        />
      </svg>
    </div>

    <!-- Notification dot -->
    <div class="notification-dot"></div>

    <!-- Ripple effect -->
    <div class="ripple-effect"></div>
  </div>
</div>
